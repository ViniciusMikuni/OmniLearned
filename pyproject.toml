[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "omnilearned"
description = "OmniLearned: A unified deep learning approach for particle physics"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Vinicius Mikuni", email = "vmikuni@gmail.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.11,<2.14",
    "numpy>=2.2.4",
    "h5py>=3.13.0",
    "scikit-learn>=1.6.1",
    "einops>=0.8.1",
    "requests>=2.32.3",
    "pytorch_optimizer>=3.5.0",
    "torchdiffeq>=0.2.5",
    "PyYAML>=6.0",
    "typer>=0.15.2",
    "tqdm>=4.67.1",

]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.11",
    "hatch-vcs>=0.3.0",
]

logging = ["wandb>=0.19"]
examples = ["jupyterlab>=4", "matplotlib>=3.8", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6"]

[project.urls]
"Homepage" = "https://github.com/ViniciusMikuni/OmniLearned"
"Bug Tracker" = "https://github.com/ViniciusMikuni/OmniLearned/issues"

[project.scripts]
omnilearned = "omnilearned.cli:app"

# Hatch configuration
[tool.hatch]
version.source = "vcs"

# Configure the VCS plugin
[tool.hatch.version.raw-options]
local_scheme = "node-and-date"
version_scheme = "no-guess-dev"
fallback_version = "0.0.0"

# Configure where to write the version file
[tool.hatch.build.hooks.vcs]
version-file = "src/omnilearned/_version.py"

# Configure package discovery
[tool.hatch.build.targets.wheel]
packages = ["src/omnilearned"]

[tool.hatch.build.targets.sdist]
include = [
    "src/omnilearned",
    "README.md",
    "shell",
    "configs",
    "docs/experiment_commands.md",
    "examples",
    "WORKFLOW_GUIDE.md",
    "PACKAGE_REVIEW.md",
    "FILE_CHANGES.md",
]

[tool.black]
line-length = 88
target-version = ["py38"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
exclude = ["*.ipynb"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["remote: public toy download", "cuda: requires CUDA", "distributed: multi-process integration"]
